services:
  postgres:
    image: postgres:16
    container_name: cars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-carsdb}
      POSTGRES_USER: ${DB_USER:-carsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carspass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carsuser} -d ${DB_NAME:-carsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cars-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: