server:
  port: 0

spring:
  application:
    name: cars-api-test

  datasource:
    url: jdbc:h2:mem:carsapi;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000

  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: cars-api-super-secret-key-with-at-least-32-characters-123456
    expiration-minutes: 60

app:
  currency:
    cache-ttl-minutes: 10
    endpoints:
      primary: https://economia.awesomeapi.com.br/json/last/USD-BRL
      fallback: https://api.frankfurter.app/latest?from=USD&to=BRL
