server:
  port: 8080

spring:
  application:
    name: cars-api

  datasource:
    url: jdbc:postgresql://localhost:5432/carsdb
    username: carsuser
    password: carspass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

#  jackson:
#    serialization:
      #WRITE_DATES_AS_TIMESTAMPS: false

  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret}
    expiration: 3600000

app:
  currency:
    cache-ttl-minutes: 10
    endpoints:
      primary: https://economia.awesomeapi.com.br/json/last/USD-BRL
      fallback: https://api.frankfurter.app/latest?from=USD&to=BRL