server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SPRING_APP_NAME}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: ${JPA_OPEN_IN_VIEW}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

  mvc:
    problemdetails:
      enabled: ${MVC_PROBLEM_DETAILS_ENABLED}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    org.springframework.security: ${LOG_LEVEL_SECURITY}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

app:
  currency:
    cache-ttl-minutes: ${CURRENCY_CACHE_TTL}
    endpoints:
      primary: ${CURRENCY_API_PRIMARY}
      fallback: ${CURRENCY_API_FALLBACK}